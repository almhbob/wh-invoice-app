<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laviviane — رمز الدخول</title>
  <style>
    @font-face{font-family:"Laviviane Sans";src:url(/brand-fonts/PlexArabic-Regular.woff) format("woff");font-weight:100 549;font-display:swap}
    @font-face{font-family:"Laviviane Sans";src:url(/brand-fonts/PlexArabic-Bold.woff) format("woff");font-weight:550 1000;font-display:swap}
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Laviviane Sans", -apple-system, 'Segoe UI', Tahoma, sans-serif;
      background: #F3F3F1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border: 2px solid #141414;
      border-radius: 20px;
      padding: 40px 50px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(47,36,29,0.12);
    }

    .logo-area {
      background: #141414;
      border-radius: 14px;
      padding: 18px 24px 14px;
      margin-bottom: 28px;
    }

    .logo-img {
      width: 180px;
      height: 68px;
      object-fit: contain;
      display: block;
      margin: 0 auto 8px;
    }

    .logo-sub {
      color: #D9602B;
      font-size: 11px;
      letter-spacing: 2px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .title-ar {
      color: #141414;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .title-en {
      color: #7A7A75;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .qr-wrapper {
      background: #F3F3F1;
      border: 1.5px solid #E2E2DE;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      display: inline-block;
    }

    .qr-wrapper img {
      width: 200px;
      height: 200px;
      display: block;
    }

    .instruction {
      color: #3A3A38;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, #D9602B, #D9602B);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .url-box {
      display: block;
      background: #ECECE9;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 11px;
      color: #5C5C59;
      text-decoration: none;
      word-break: break-all;
      direction: ltr;
      text-align: center;
      font-family: monospace;
    }

    .footer {
      margin-top: 24px;
      color: #9A9A95;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    @media print {
      body { background: #fff; padding: 0; }
      .card {
        box-shadow: none;
        border-color: #141414;
        max-width: 100%;
        margin: 0;
        border-radius: 0;
        page-break-inside: avoid;
      }
      .print-btn { display: none !important; }
    }

    .print-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      background: #141414;
      color: #D9602B;
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: opacity 0.2s;
    }

    .print-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-area">
      <img class="logo-img" src="/laviviane-logo.png" alt="Laviviane" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
      <div style="display:none;color:#D9602B;font-size:22px;font-weight:700;letter-spacing:3px;font-family:inherit">LAVIVIANE</div>
      <div class="logo-sub">Maison de Pâtisserie</div>
    </div>

    <div class="title-ar">رمز الدخول للنظام</div>
    <div class="title-en">System Access QR Code</div>

    <div class="divider"></div>

    <div class="qr-wrapper">
      <img src="/laviviane-qr.png" alt="QR Code" />
    </div>

    <p class="instruction">
      وجّه كاميرا هاتفك نحو الرمز<br />للدخول المباشر إلى نظام لاففيان
    </p>

    <a class="url-box" href="https://fotra-dv1.pages.dev/?company=laviviane-trial">https://fotra-dv1.pages.dev/?company=laviviane-trial</a>

    <div class="footer">Laviviane · Fondée en 2010 🌹</div>

    <button class="print-btn" onclick="window.print()">
      🖨️ &nbsp; طباعة الرمز
    </button>
  </div>
</body>
</html>
