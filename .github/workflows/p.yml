name: tmp-probe-login
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm init -y >/dev/null; npm i playwright@1.48.2 >i.log 2>&1; npx playwright install --with-deps chromium >>i.log 2>&1 || echo "::notice title=inst::$(tail -c 600 i.log | tr '\n' ' ')"
      - run: |
          cat > p.js <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const out = [];
            const b = await chromium.launch();
            for (const [label, url] of [["bare","https://fotra-dv1.pages.dev/"],["qr","https://fotra-dv1.pages.dev/?company=laviviane-trial"]]) {
              const ctx = await b.newContext({ ...devices['iPhone 13'], locale: 'ar-SA' });
              const p = await ctx.newPage();
              const errs = [];
              p.on('pageerror', e => errs.push(e.message.slice(0,120)));
              p.on('response', r => { if (r.status() >= 400) errs.push(r.status()+' '+r.url().slice(0,90)); });
              await p.goto(url, { waitUntil: 'load', timeout: 60000 });
              await p.waitForTimeout(4000);
              const t1 = (await p.innerText('body')).replace(/\s+/g,' ').slice(0,260);
              out.push(`[${label}] screen1: ${t1}`);
              // Enter Laviviane if gate shown
              const enter = p.getByText(/الدخول|دخول/).first();
              const inputs = await p.locator('input').count();
              if (inputs < 2 && await enter.count()) { await enter.click().catch(()=>{}); await p.waitForTimeout(4000); }
              const ins = p.locator('input');
              out.push(`[${label}] inputs=${await ins.count()}`);
              if (await ins.count() >= 2) {
                await ins.nth(0).fill('probe-nobody-x'); await ins.nth(1).fill('0000');
                await p.getByText(/تسجيل الدخول|دخول الموظف|دخول/).last().click().catch(()=>{});
                await p.waitForTimeout(7000);
                out.push(`[${label}] after-login: ${(await p.innerText('body')).replace(/\s+/g,' ').slice(0,300)}`);
              }
              out.push(`[${label}] errors: ${errs.slice(0,6).join(' ; ')}`);
              await ctx.close();
            }
            await b.close();
            console.log(out.join('\n'));
            require('fs').writeFileSync('r.txt', out.join(' || '));
          })();
          JS
          node p.js > o.txt 2>&1 || true
          [ -f r.txt ] || cp o.txt r.txt
          sed -i 's/\r//g' r.txt
          echo "::notice title=ui::$(tr "\n" " " < r.txt | cut -c1-3000)"
