name: Security tests

on:
  pull_request:
    paths: ["firestore.rules", "tests/**", "server/**", "functions/**", "utils/deepClean.ts", "context/**", "lib/loyaltyTx.ts", "lib/purge.ts", "constants/loyalty.ts", ".github/workflows/rules-test.yml"]
  push:
    branches: [main]
    paths: ["firestore.rules", "tests/**", "server/**", "functions/**", "utils/deepClean.ts", "context/**", "lib/loyaltyTx.ts", "lib/purge.ts", "constants/loyalty.ts"]
  workflow_dispatch:

jobs:
  auth-server:
    name: Auth server unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test server tests/unit
      - run: npx -y -p typescript@5.9 tsc -p tsconfig.functions.json

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: oven-sh/setup-bun@v2
      - name: Prepare isolated test workspace
        run: |
          mkdir -p /tmp/rt && cp firestore.rules tests/rules/firestore.rules.test.mjs tests/rules/flows.test.mjs /tmp/rt/
          bun build utils/deepClean.ts --format esm --outfile /tmp/rt/deepClean.mjs
          bun build lib/loyaltyTx.ts --format esm --external firebase/firestore --outfile /tmp/rt/loyaltyTx.mjs
          cp tests/rules/loyalty.test.mjs tests/rules/purge.test.mjs /tmp/rt/
          bun build lib/purge.ts --format esm --external firebase/firestore --outfile /tmp/rt/purge.mjs
          cd /tmp/rt
          echo '{"type":"module"}' > package.json
          echo '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > firebase.json
          npm i firebase-tools@14 @firebase/rules-unit-testing@4 firebase@11 >/dev/null
      - name: Run rules tests against the emulator
        working-directory: /tmp/rt
        run: |
          set -o pipefail
          npx firebase emulators:exec --only firestore --project rules-test "node firestore.rules.test.mjs && node flows.test.mjs && node loyalty.test.mjs && node purge.test.mjs" 2>&1 | tee out.txt || {
            # Surface the failure as an annotation (readable without downloading logs).
            echo "::error title=Emulator tests::$(grep -vE '^\s*$|^i  |emulators' out.txt | tail -n 25 | sed 's/%/%25/g' | tr '\n' '|' | sed 's/|/%0A/g')"
            exit 1
          }
